<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Urlaubs-Kleidungsrechner mit Datum</title>
</head>
<body>

    <h1>Kleidungs-Urlaubsrechner (Nach Datum)</h1>
    
    <p>
        <label for="anreise">Anreisedatum:</label><br>
        <input type="date" id="anreise" onchange="setzeMindestAbreise()">
    </p>

    <p>
        <label for="abreise">Abreisedatum:</label><br>
        <input type="date" id="abreise">
    </p>

    <p>
        <label for="brauchtPulli">Brauchst du überhaupt Pullis?</label><br>
        <select id="brauchtPulli">
            <option value="ja">Ja</option>
            <option value="nein">Nein (Sommerurlaub)</option>
        </select>
    </p>
    
    <button onclick="berechneKleidung()">Berechnen</button>

    <div id="reiseInfo" style="margin-top: 15px; font-weight: bold;"></div>

    <h2>Das muss in den Koffer (bereits angezogene Kleidung abgezogen):</h2>
    <ul>
        <li>T-Shirts: <span id="tshirts">0</span></li>
        <li>Unterwäsche: <span id="unterwaesche">0</span></li>
        <li>Hosen: <span id="hosen">0</span></li>
        <li>Pullis: <span id="pullis">0</span></li>
    </ul>

    <script>
        // Setzt das heutige Datum als Standard für die Anreise
        const heute = new Date().toISOString().split('T')[0];
        document.getElementById('anreise').value = heute;
        
        function setzeMindestAbreise() {
            // Das Abreisedatum kann nicht vor dem Anreisedatum liegen
            const anreiseWert = document.getElementById('anreise').value;
            document.getElementById('abreise').min = anreiseWert;
        }
        
        // Initialisiere das Mindestdatum beim Laden
        setzeMindestAbreise();

        function berechneKleidung() {
            const anreiseInput = document.getElementById('anreise').value;
            const abreiseInput = document.getElementById('abreise').value;
            const brauchtPulli = document.getElementById('brauchtPulli').value === 'ja';
            
            if (!anreiseInput || !abreiseInput) {
                alert("Bitte gib sowohl ein Anreise- als auch ein Abreisedatum ein.");
                return;
            }

            const anreiseDatum = new Date(anreiseInput);
            const abreiseDatum = new Date(abreiseInput);
            
            // Berechnung der Millisekunden Differenz und Umrechnung in Nächte
            const zeitDifferenz = abreiseDatum.getTime() - anreiseDatum.getTime();
            const naechte = Math.ceil(zeitDifferenz / (1000 * 3600 * 24));
            
            if (naechte < 0) {
                alert("Das Abreisedatum darf nicht vor dem Anreisedatum liegen.");
                return;
            }

            // Gesamte Tage im Urlaub (Nächte + 1)
            const tageGesamt = naechte + 1;

            // Info-Text anzeigen
            document.getElementById('reiseInfo').innerText = `Deine Reise: ${naechte} Nächte (${tageGesamt} Tage)`;

            // ==========================================
            // 1. T-SHIRTS BERECHNUNG
            // ==========================================
            let tshirtsBedarf = 0;
            if (tageGesamt === 1) {
                tshirtsBedarf = 1;
            } else if (tageGesamt === 2) {
                tshirtsBedarf = 2; // Anreise + Abreise
            } else {
                // Erstes T-Shirt hält Tag 1, 2, 3. Ab Tag 4 neue für dazwischen. Plus Abreisetag.
                const restTage = tageGesamt - 4; 
                let tshirtsDazwischen = 0;
                if (restTage > 0) {
                    tshirtsDazwischen = Math.ceil(restTage / 3);
                }
                tshirtsBedarf = 2 + tshirtsDazwischen;
            }
            // +1 Auswechselstück
            tshirtsBedarf += 1;
            
            // Koffer-Menge: Gesamtbedarf minus das T-Shirt am Körper
            let tshirtsKoffer = tshirtsBedarf - 1;


            // ==========================================
            // 2. UNTERWÄSCHE BERECHNUNG
            // ==========================================
            // Bedarf: 1 pro Tag + 1 Auswechselstück
            let unterwaescheBedarf = tageGesamt + 1;
            
            // Koffer-Menge: minus die Unterwäsche am Körper
            let unterwaescheKoffer = unterwaescheBedarf - 1;


            // ==========================================
            // 3. HOSEN BERECHNUNG
            // ==========================================
            // Bedarf: 1 Basis-Hose pro angefangene 7 Tage + 1 Auswechselstück
            let hosenBedarf = Math.ceil(tageGesamt / 7) + 1;
            
            // Koffer-Menge: minus die Hose am Körper
            let hosenKoffer = hosenBedarf - 1;


            // ==========================================
            // 4. PULLIS BERECHNUNG
            // ==========================================
            let pullisKoffer = 0;
            if (brauchtPulli) {
                let pullisBedarf = Math.ceil(tageGesamt / 7) + 1;
                // Koffer-Menge: minus den Pulli am Körper
                pullisKoffer = pullisBedarf - 1;
            }

            // Ergebnisse im HTML aktualisieren
            document.getElementById('tshirts').innerText = Math.max(0, tshirtsKoffer);
            document.getElementById('unterwaesche').innerText = Math.max(0, unterwaescheKoffer);
            document.getElementById('hosen').innerText = Math.max(0, hosenKoffer);
            document.getElementById('pullis').innerText = Math.max(0, pullisKoffer);
        }
    </script>

</body>
</html>
