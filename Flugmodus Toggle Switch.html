<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flugmodus Toggle</title>
<style>
  :root {
    --switch-width: 220px;
    --switch-height: 110px;
    --bg-light: #f4f5f7;
    --bg-dark: #0f1115;
    --card-light: #ffffff;
    --card-dark: #1a1d24;
    --text-light: #1a1a1a;
    --text-dark: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--bg-dark);
      --card: var(--card-dark);
      --text: var(--text-dark);
    }
  }
  :root {
    --bg: var(--bg-light);
    --card: var(--card-light);
    --text: var(--text-light);
  }
  :root[data-theme="dark"] {
    --bg: var(--bg-dark);
    --card: var(--card-dark);
    --text: var(--text-dark);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }

  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    max-width: 90vw;
  }

  .label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status {
    font-size: 13px;
    opacity: 0.6;
    min-height: 18px;
  }

  /* --- The Switch --- */
  .switch {
    position: relative;
    width: var(--switch-width);
    height: var(--switch-height);
    border-radius: calc(var(--switch-height) / 2);
    cursor: pointer;
    overflow: hidden;
    border: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #8a8f98, #6b7078);
    transition: background 0.6s ease;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25), 0 4px 14px rgba(0,0,0,0.15);
  }

  .switch.on {
    background: linear-gradient(180deg, #4facfe, #2f8ae0);
  }

  /* Runway (off state) */
  .runway {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .switch.on .runway { opacity: 0; }

  .runway::before {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(
      to right,
      #fff 0 16px,
      transparent 16px 30px
    );
    opacity: 0.85;
  }

  .lights {
    position: absolute;
    inset: 10px;
    border-radius: inherit;
    pointer-events: none;
  }
  .lights span {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffd24d;
    box-shadow: 0 0 6px 1px rgba(255,210,77,0.8);
  }
  .lights span:nth-child(1) { top: 8px; left: 20%; }
  .lights span:nth-child(2) { top: 8px; left: 45%; }
  .lights span:nth-child(3) { top: 8px; left: 70%; }
  .lights span:nth-child(4) { bottom: 8px; left: 20%; }
  .lights span:nth-child(5) { bottom: 8px; left: 45%; }
  .lights span:nth-child(6) { bottom: 8px; left: 70%; }

  /* Sky (on state) */
  .sky {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .switch.on .sky { opacity: 1; }

  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50px;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
  }
  .cloud.c1 { width: 46px; height: 16px; top: 28%; left: 14%; }
  .cloud.c1::before { width: 22px; height: 22px; top: -10px; left: 4px; }
  .cloud.c1::after { width: 16px; height: 16px; top: -7px; left: 22px; }

  .cloud.c2 { width: 36px; height: 12px; top: 62%; left: 22%; }
  .cloud.c2::before { width: 16px; height: 16px; top: -7px; left: 3px; }
  .cloud.c2::after { width: 12px; height: 12px; top: -5px; left: 16px; }

  /* Airplane knob */
  .knob {
    position: absolute;
    top: 50%;
    left: calc(var(--switch-height) / 2);
    width: calc(var(--switch-height) - 20px);
    height: calc(var(--switch-height) - 20px);
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .switch.on .knob {
    left: calc(100% - var(--switch-height) / 2);
  }

  .knob svg {
    width: 55%;
    height: 55%;
    transition: transform 0.5s ease, fill 0.4s ease;
    fill: #4a4f58;
  }
  .switch.on .knob svg {
    fill: #2f8ae0;
    transform: rotate(90deg);
  }

  .switch:active .knob {
    transform: translate(-50%, -50%) scale(0.94);
  }

  .hint {
    font-size: 12px;
    opacity: 0.5;
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="label">✈️ Flugmodus</div>

    <button class="switch" id="switchBtn" role="switch" aria-checked="false" aria-label="Flugmodus umschalten">
      <div class="runway">
        <div class="lights">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="sky">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
      </div>
      <div class="knob">
        <svg viewBox="0 0 24 24"><path d="M21,16V14L13,9V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z"/></svg>
      </div>
    </button>

    <div class="status" id="statusText">Aus</div>
  </div>

  <div class="hint">
    Rein optischer Toggle (Nachbau des CSS-Designs). Schaltet <strong>nicht</strong> den echten Flugmodus deines Handys — Android erlaubt Apps das seit Version 4.2 nicht mehr direkt.
  </div>

<script>
  const btn = document.getElementById('switchBtn');
  const status = document.getElementById('statusText');
  let on = false;

  btn.addEventListener('click', () => {
    on = !on;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    status.textContent = on ? 'An' : 'Aus';
  });
</script>

</body>
</html>
