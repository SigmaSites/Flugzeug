<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flug-Zeiten-Helfer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(160deg, #2b2d42, #1a1c2e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f4f4f9;
    padding: 1.5rem 1rem 3rem 1rem;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 0.3rem 0;
    text-align: center;
  }
  .intro {
    color: #a0a3c0;
    font-size: 0.85rem;
    text-align: center;
    max-width: 380px;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #23253f;
    border-radius: 16px;
    padding: 1.2rem;
    margin-bottom: 1.2rem;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 0.8rem 0;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: #a0a3c0;
    margin-top: 0.6rem;
    margin-bottom: 0.25rem;
  }
  input, select {
    width: 100%;
    background: #14162a;
    border: 1px solid #3a3d63;
    border-radius: 8px;
    color: #f4f4f9;
    padding: 0.6rem 0.7rem;
    font-size: 0.95rem;
  }
  input[type="file"] {
    padding: 0.5rem;
  }
  .screenshot-preview {
    margin-top: 0.8rem;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #3a3d63;
    display: none;
  }
  .screenshot-preview img {
    width: 100%;
    display: block;
  }
  .flight-block {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .flight-block-title {
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px solid #3a3d63;
  }
  .flight-block-title:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .row {
    display: flex;
    gap: 0.6rem;
  }
  .row > div { flex: 1; }
  button {
    border: none;
    border-radius: 12px;
    padding: 0.9rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 1rem;
  }
  .calc-btn {
    background: #4ade80;
    color: #10331e;
  }
  .result {
    display: none;
    background: #14162a;
    border-radius: 12px;
    padding: 1rem;
    margin-top: 1rem;
    border: 1px solid #4ade80;
  }
  .result.visible { display: block; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid #2a2c4a;
  }
  .result-row:last-child { border-bottom: none; }
  .result-label {
    font-size: 0.75rem;
    color: #a0a3c0;
  }
  .result-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #4ade80;
  }
  .copy-btn {
    background: #38bdf8;
    color: #072a3a;
    font-size: 0.8rem;
    padding: 0.4rem 0.7rem;
    width: auto;
    margin: 0;
    margin-left: 0.6rem;
  }
  .result-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-note {
    font-size: 0.72rem;
    color: #a0a3c0;
    margin-top: 0.6rem;
    line-height: 1.4;
  }
  .status-note.warn { color: #fbbf24; }
  .footer {
    font-size: 0.72rem;
    color: #6b6f95;
    text-align: center;
    max-width: 380px;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>

  <h1>✈️ Flug-Zeiten-Helfer</h1>
  <div class="intro">
  </div>

  <div class="card">
    <h2>1. Screenshot hochladen (zum Ablesen)</h2>
    <input type="file" id="screenshot-input" accept="image/*" />
    <div class="screenshot-preview" id="screenshot-preview">
      <img id="screenshot-img" alt="Screenshot" />
    </div>
  </div>

  <div class="card">
    <h2>2. Werte ablesen und eintragen</h2>

    <div class="flight-block">
      <div class="flight-block-title">Abflug</div>
      <label>Flughafen (IATA-Code, z. B. CGN)</label>
      <input type="text" id="dep-airport" maxlength="3" placeholder="z.b.: NUE/AYT" style="text-transform:uppercase;" />
      <div class="row">
        <div>
          <label>Datum</label>
          <input type="date" id="dep-date" />
        </div>
        <div>
          <label>Uhrzeit</label>
          <input type="time" id="dep-time" />
        </div>
      </div>
    </div>

    <div class="flight-block">
      <div class="flight-block-title">Ankunft</div>
      <label>Flughafen (IATA-Code, z. B. HRG)</label>
      <input type="text" id="arr-airport" maxlength="3" placeholder="z.b.: HRG/FRA" style="text-transform:uppercase;" />
      <div class="row">
        <div>
          <label>Datum</label>
          <input type="date" id="arr-date" />
        </div>
        <div>
          <label>Uhrzeit</label>
          <input type="time" id="arr-time" />
        </div>
      </div>
    </div>

    <div id="tz-note" class="status-note"></div>

    <button class="calc-btn" onclick="calculate()">🧮 Umrechnen</button>

    <div class="result" id="result">
      <div class="result-row">
        <div class="result-label">Abflug eintragen als</div>
        <div class="result-line">
          <span class="result-value" id="result-dep">--</span>
          <button class="copy-btn" onclick="copyValue('result-dep')">Kopieren</button>
        </div>
      </div>
      <div class="result-row">
        <div class="result-label">Ankunft eintragen als</div>
        <div class="result-line">
          <span class="result-value" id="result-arr">--</span>
          <button class="copy-btn" onclick="copyValue('result-arr')">Kopieren</button>
        </div>
      </div>
      <div class="result-row">
        <div class="result-label">Flugdauer</div>
        <div class="result-value" id="result-duration">--</div>
      </div>
    </div>
  </div>

  <div class="footer">

  </div>

<script>
  // ---------- Screenshot-Vorschau ----------
  const screenshotInput = document.getElementById("screenshot-input");
  const screenshotPreview = document.getElementById("screenshot-preview");
  const screenshotImg = document.getElementById("screenshot-img");

  screenshotInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      screenshotImg.src = ev.target.result;
      screenshotPreview.style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  // ---------- Zeitzonen-Zuordnung (IATA -> IANA) ----------
  const AIRPORT_TIMEZONES = {
    // Deutschland
    FRA: "Europe/Berlin", MUC: "Europe/Berlin", CGN: "Europe/Berlin", DUS: "Europe/Berlin",
    HAM: "Europe/Berlin", BER: "Europe/Berlin", STR: "Europe/Berlin", HAJ: "Europe/Berlin",
    NUE: "Europe/Berlin", LEJ: "Europe/Berlin", DTM: "Europe/Berlin", FMO: "Europe/Berlin",
    BRE: "Europe/Berlin", DRS: "Europe/Berlin",
    // Ägypten
    HRG: "Africa/Cairo", SSH: "Africa/Cairo", CAI: "Africa/Cairo", LXR: "Africa/Cairo",
    // Türkei
    AYT: "Europe/Istanbul", DLM: "Europe/Istanbul", ADB: "Europe/Istanbul", IST: "Europe/Istanbul",
    BJV: "Europe/Istanbul", ESB: "Europe/Istanbul",
    // Spanien / Balearen / Kanaren
    PMI: "Europe/Madrid", AGP: "Europe/Madrid", ALC: "Europe/Madrid", IBZ: "Europe/Madrid",
    BCN: "Europe/Madrid", MAD: "Europe/Madrid", VLC: "Europe/Madrid",
    LPA: "Atlantic/Canary", ACE: "Atlantic/Canary", FUE: "Atlantic/Canary", TFS: "Atlantic/Canary", TFN: "Atlantic/Canary",
    // Griechenland
    RHO: "Europe/Athens", HER: "Europe/Athens", CFU: "Europe/Athens", ZTH: "Europe/Athens",
    CHQ: "Europe/Athens", ATH: "Europe/Athens", JTR: "Europe/Athens", KGS: "Europe/Athens",
    // Portugal
    FAO: "Europe/Lisbon", LIS: "Europe/Lisbon", FNC: "Atlantic/Madeira",
    // Naher Osten / Nordafrika
    DXB: "Asia/Dubai", AUH: "Asia/Dubai", RAK: "Africa/Casablanca", AGA: "Africa/Casablanca",
    TUN: "Africa/Tunis", DJE: "Africa/Tunis",
    // Karibik / Amerika / Fernziele
    PUJ: "America/Santo_Domingo", CUN: "America/Cancun", MRU: "Indian/Mauritius",
    // Weitere europäische Länder
    LCA: "Asia/Nicosia", PFO: "Asia/Nicosia", LGW: "Europe/London", LHR: "Europe/London",
    CDG: "Europe/Paris", ORY: "Europe/Paris", FCO: "Europe/Rome", MXP: "Europe/Rome",
    VIE: "Europe/Vienna", ZRH: "Europe/Zurich", AMS: "Europe/Amsterdam", CPH: "Europe/Copenhagen",
    ARN: "Europe/Stockholm", OSL: "Europe/Oslo", HEL: "Europe/Helsinki", WAW: "Europe/Warsaw",
    PRG: "Europe/Prague", BUD: "Europe/Budapest"
  };

  const DEVICE_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

  function getZoneOffsetMinutes(timeZone, atDate) {
    const dtf = new Intl.DateTimeFormat("en-US", {
      timeZone, hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    const parts = dtf.formatToParts(atDate).reduce((acc, p) => {
      if (p.type !== "literal") acc[p.type] = p.value;
      return acc;
    }, {});
    const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
    return (asUTC - atDate.getTime()) / 60000;
  }

  function zonedLocalToUtcMs(y, mo, d, h, mi, timeZone) {
    const guessUtcMs = Date.UTC(y, mo - 1, d, h, mi);
    const offsetMinutes = getZoneOffsetMinutes(timeZone, new Date(guessUtcMs));
    return guessUtcMs - offsetMinutes * 60000;
  }

  function utcMsToDeviceLocalString(utcMs) {
    const d = new Date(utcMs);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Live-Hinweis, welche Zeitzonen erkannt wurden
  const depAirportInput = document.getElementById("dep-airport");
  const arrAirportInput = document.getElementById("arr-airport");
  const tzNote = document.getElementById("tz-note");

  function updateTzNote() {
    const depCode = depAirportInput.value.trim().toUpperCase();
    const arrCode = arrAirportInput.value.trim().toUpperCase();
    const depZone = AIRPORT_TIMEZONES[depCode];
    const arrZone = AIRPORT_TIMEZONES[arrCode];
    let lines = [];
    let warn = false;

    if (depCode) {
      lines.push(depZone ? `Abflug ${depCode} → ${depZone}` : `Abflug ${depCode}: Zeitzone unbekannt → wird als Geräte-Zeitzone (${DEVICE_ZONE}) angenommen`);
      if (!depZone) warn = true;
    }
    if (arrCode) {
      lines.push(arrZone ? `Ankunft ${arrCode} → ${arrZone}` : `Ankunft ${arrCode}: Zeitzone unbekannt → wird als Geräte-Zeitzone (${DEVICE_ZONE}) angenommen`);
      if (!arrZone) warn = true;
    }
    tzNote.textContent = lines.join(" · ");
    tzNote.className = "status-note" + (warn ? " warn" : "");
  }
  depAirportInput.addEventListener("input", updateTzNote);
  arrAirportInput.addEventListener("input", updateTzNote);

  function calculate() {
    const depCode = depAirportInput.value.trim().toUpperCase();
    const arrCode = arrAirportInput.value.trim().toUpperCase();
    const depDate = document.getElementById("dep-date").value;
    const depTime = document.getElementById("dep-time").value;
    const arrDate = document.getElementById("arr-date").value;
    const arrTime = document.getElementById("arr-time").value;

    if (!depDate || !depTime || !arrDate || !arrTime) {
      alert("Bitte alle Datums- und Uhrzeitfelder für Abflug und Ankunft ausfüllen.");
      return;
    }

    const depZone = AIRPORT_TIMEZONES[depCode] || DEVICE_ZONE;
    const arrZone = AIRPORT_TIMEZONES[arrCode] || DEVICE_ZONE;

    const [dy, dmo, dd] = depDate.split("-").map(Number);
    const [dh, dmi] = depTime.split(":").map(Number);
    const [ay, amo, ad] = arrDate.split("-").map(Number);
    const [ah, ami] = arrTime.split(":").map(Number);

    const depUtcMs = zonedLocalToUtcMs(dy, dmo, dd, dh, dmi, depZone);
    const arrUtcMs = zonedLocalToUtcMs(ay, amo, ad, ah, ami, arrZone);

    if (arrUtcMs <= depUtcMs) {
      alert("Die Ankunft liegt zeitlich vor dem Abflug — bitte Werte prüfen (Datum vergessen bei Ankunft am nächsten Tag?).");
      return;
    }

    document.getElementById("result-dep").textContent = utcMsToDeviceLocalString(depUtcMs);
    document.getElementById("result-arr").textContent = utcMsToDeviceLocalString(arrUtcMs);

    const durationMin = Math.round((arrUtcMs - depUtcMs) / 60000);
    const h = Math.floor(durationMin / 60);
    const m = durationMin % 60;
    document.getElementById("result-duration").textContent = `${h}h ${String(m).padStart(2, "0")}m`;

    document.getElementById("result").classList.add("visible");
  }

  function copyValue(elId) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert("Kopiert: " + text);
    }).catch(() => {
      alert("Kopieren nicht möglich — bitte Wert manuell markieren.");
    });
  }
</script>

</body>
</html>
