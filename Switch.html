<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flugmodus Toggle</title>
<style>
  :root {
    --rotation-speed: 0,8s;
    --switch-width: 220px;
    --switch-height: 110px;
    --bg-light: #f4f5f7;
    --bg-dark: #0f1115;
    --card-light: #ffffff;
    --card-dark: #1a1d24;
    --text-light: #1a1a1a;
    --text-dark: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--bg-dark);
      --card: var(--card-dark);
      --text: var(--text-dark);
    }
  }
  :root {
    --bg: var(--bg-light);
    --card: var(--card-light);
    --text: var(--text-light);
  }
  :root[data-theme="dark"] {
    --bg: var(--bg-dark);
    --card: var(--card-dark);
    --text: var(--text-dark);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }

  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    max-width: 90vw;
  }

  .label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status {
    font-size: 13px;
    opacity: 0.6;
    min-height: 18px;
  }

  /* --- The Switch --- */
  .switch {
    position: relative;
    width: var(--switch-width);
    height: var(--switch-height);
    border-radius: calc(var(--switch-height) / 2);
    cursor: pointer;
    overflow: hidden;
    border: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #8a8f98, #6b7078);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.25), 0 4px 14px rgba(0,0,0,0.15);
  }

  /* Runway (off state) */
  .runway {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .runway::before {
    content: "";
    position: absolute;
    left: 14%;
    right: 14%;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(
      to right,
      #fff 0 16px,
      transparent 16px 30px
    );
    opacity: 0.85;
  }

  .lights {
    position: absolute;
    inset: 10px;
    border-radius: inherit;
    pointer-events: none;
  }
  .lights span {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffd24d;
    box-shadow: 0 0 6px 1px rgba(255,210,77,0.8);
  }
  .lights span:nth-child(1) { top: 8px; left: 20%; }
  .lights span:nth-child(2) { top: 8px; left: 45%; }
  .lights span:nth-child(3) { top: 8px; left: 70%; }
  .lights span:nth-child(4) { bottom: 8px; left: 20%; }
  .lights span:nth-child(5) { bottom: 8px; left: 45%; }
  .lights span:nth-child(6) { bottom: 8px; left: 70%; }

  /* Sky (on state) */
  .sky {
    position: absolute;
    inset: 0;
  }

  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50px;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
  }
  .cloud.c1 { width: 46px; height: 16px; top: 28%; left: 14%; }
  .cloud.c1::before { width: 22px; height: 22px; top: -10px; left: 4px; }
  .cloud.c1::after { width: 16px; height: 16px; top: -7px; left: 22px; }

  .cloud.c2 { width: 36px; height: 12px; top: 62%; left: 22%; }
  .cloud.c2::before { width: 16px; height: 16px; top: -7px; left: 3px; }
  .cloud.c2::after { width: 12px; height: 12px; top: -5px; left: 16px; }

  /* Airplane knob */
  .knob {
    position: absolute;
    top: 50%;
    left: calc(var(--switch-height) / 2);
    width: calc(var(--switch-height) - 20px);
    height: calc(var(--switch-height) - 20px);
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    touch-action: none;
    cursor: grab;
  }
  .switch.dragging .knob {
    cursor: grabbing;
  }

  .knob svg {
    width: 55%;
    height: 55%;
    fill: #4a4f58;
    transform: rotate(90deg);
    transition: transform var(--rotation-speed) ease;
  }

  .hint {
    font-size: 12px;
    opacity: 0.5;
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="label">✈️ Flugmodus steuern</div>

    <button class="switch" id="switchBtn" role="switch" aria-checked="false" aria-label="Flugmodus einschalten">
      <div class="runway">
        <div class="lights">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="sky">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
      </div>
      <div class="knob">
        <svg viewBox="0 0 24 24"><path d="M21,16V14L13,9V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z"/></svg>
      </div>
    </button>

    <div class="status" id="statusText">Aus</div>
  </div>

<script>
  const btn = document.getElementById('switchBtn');
  const knob = btn.querySelector('.knob');
  const svg = knob.querySelector('svg');
  const runway = btn.querySelector('.runway');
  const sky = btn.querySelector('.sky');
  const status = document.getElementById('statusText');

  let on = false;
  let progress = 0;       // 0 = ganz aus, 1 = ganz an - fließender Wert
  let facingRight = true; // Nase zeigt in Bewegungsrichtung: rechts = Start/Steigflug, links = Landung
  let lastProgress = 0;
  let dragging = false;
  let pressed = false;
  let moved = false;
  let startX = 0;
  let startProgress = 0;
  let animFrame = null;
  const edgePad = 10; // wie im CSS: Abstand Knob-Rand zum Switch-Rand
  const liftAmount = 16; // px, wie hoch das Flugzeug im "Himmel" schwebt

  function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function lerpColor(hex1, hex2, t) {
    const c1 = parseInt(hex1.slice(1), 16);
    const c2 = parseInt(hex2.slice(1), 16);
    const r = Math.round(lerp((c1 >> 16) & 255, (c2 >> 16) & 255, t));
    const g = Math.round(lerp((c1 >> 8) & 255, (c2 >> 8) & 255, t));
    const b = Math.round(lerp(c1 & 255, c2 & 255, t));
    return `rgb(${r}, ${g}, ${b})`;
  }

  function getBounds() {
    const knobSize = knob.offsetWidth;
    const min = knobSize / 2 + edgePad;
    const max = btn.clientWidth - knobSize / 2 - edgePad;
    return { min, max };
  }

  // Zeichnet den Switch für einen beliebigen Zwischenwert 0..1
  function render(p) {
    const { min, max } = getBounds();
    const leftPx = lerp(min, max, p);
    knob.style.left = leftPx + 'px';

    // Vertikal: bei p=0 sitzt das Flugzeug genau auf der Landebahn-Linie,
    // bei p=1 schwebt es oben im Himmel - dazwischen fließend interpoliert.
    // Beim Ausschalten (p -> 0) "sinkt" es also sichtbar Richtung Landebahn.
    const lift = -liftAmount * easeInOutQuad(p);
    const scale = pressed ? 0.94 : 1;
    knob.style.transform = `translate(-50%, calc(-50% + ${lift}px)) scale(${scale})`;

    runway.style.opacity = 1 - p;
    sky.style.opacity = p;

    const topColor = lerpColor('#8a8f98', '#4facfe', p);
    const bottomColor = lerpColor('#6b7078', '#2f8ae0', p);
    btn.style.background = `linear-gradient(180deg, ${topColor}, ${bottomColor})`;

    svg.style.fill = lerpColor('#4a4f58', '#2f8ae0', p);
    svg.style.transform = `rotate(${facingRight ? 90 : -90}deg)`;
  }

  function settle(targetOn) {
    cancelAnimationFrame(animFrame);
    facingRight = targetOn; // an/steigen = rechts, aus/landen = links
    const from = progress;
    const to = targetOn ? 1 : 0;
    const duration = 260;
    const start = performance.now();

    function easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function step(now) {
      const t = clamp((now - start) / duration, 0, 1);
      progress = lerp(from, to, easeOutBack(t));
      render(clamp(progress, 0, 1));
      if (t < 1) {
        animFrame = requestAnimationFrame(step);
      } else {
        progress = to;
        render(progress);
        on = targetOn;
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
        status.textContent = on ? 'An' : 'Aus';
      }
    }
    animFrame = requestAnimationFrame(step);
  }

  function onPointerDown(e) {
    cancelAnimationFrame(animFrame);
    dragging = true;
    pressed = true;
    moved = false;
    btn.classList.add('dragging');
    knob.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startProgress = progress;
    render(progress);
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const { min, max } = getBounds();
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;

    const deltaProgress = dx / (max - min);
    const newProgress = clamp(startProgress + deltaProgress, 0, 1);

    if (newProgress !== lastProgress) {
      facingRight = newProgress > lastProgress;
    }
    lastProgress = newProgress;
    progress = newProgress;
    render(progress);
  }

  function onPointerUp() {
    if (!dragging) return;
    dragging = false;
    pressed = false;
    btn.classList.remove('dragging');

    if (moved) {
      settle(progress > 0.5);
    } else {
      settle(!on);
    }
  }

  knob.addEventListener('pointerdown', onPointerDown);
  knob.addEventListener('pointermove', onPointerMove);
  knob.addEventListener('pointerup', onPointerUp);
  knob.addEventListener('pointercancel', onPointerUp);

  // Klick irgendwo sonst auf den Switch (nicht auf den Knob) = auch umschalten
  btn.addEventListener('click', (e) => {
    if (e.target === knob || knob.contains(e.target)) return;
    settle(!on);
  });

  // Startzustand zeichnen
  render(progress);
  window.addEventListener('resize', () => render(progress));
</script>

</body>
</html>
