<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klo Counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #2b2d42, #1a1c2e);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f4f4f9;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.2rem;
    letter-spacing: 0.5px;
  }
  .count {
    font-size: 6rem;
    font-weight: 700;
    margin: 0.5rem 0 1.5rem 0;
    text-shadow: 0 4px 20px rgba(255,255,255,0.15);
  }
  .buttons {
    display: flex;
    gap: 1rem;
  }
  button {
    border: none;
    border-radius: 14px;
    padding: 1rem 1.6rem;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.94); }
  .plus {
    background: #4ade80;
    color: #10331e;
  }
  .minus {
    background: #f87171;
    color: #3a0d0d;
  }
  .reset {
    margin-top: 2rem;
    background: transparent;
    border: 1px solid #555a7a;
    color: #a0a3c0;
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .reset:hover { opacity: 0.8; }
  .footer {
    margin-top: 2.5rem;
    font-size: 0.75rem;
    color: #6b6f95;
    text-align: center;
    padding: 0 1rem;
  }

  .flight-section {
    margin-top: 2rem;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .toggle-flight {
    background: #38bdf8;
    color: #072a3a;
    padding: 0.7rem 1.2rem;
    border-radius: 12px;
  }
  .flight-panel {
    margin-top: 1rem;
    width: 100%;
    background: #23253f;
    border-radius: 16px;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .flight-panel.hidden, .remaining-display.hidden { display: none; }
  .flight-panel h2 {
    font-size: 1rem;
    margin: 0 0 0.5rem 0;
    color: #f4f4f9;
  }
  .flight-panel label {
    font-size: 0.75rem;
    color: #a0a3c0;
    margin-top: 0.4rem;
  }
  .flight-panel input {
    background: #14162a;
    border: 1px solid #3a3d63;
    border-radius: 8px;
    color: #f4f4f9;
    padding: 0.55rem 0.7rem;
    font-size: 0.95rem;
  }
  .manual-inputs {
    display: flex;
    flex-direction: column;
    margin-top: 0.7rem;
    border-top: 1px solid #3a3d63;
    padding-top: 0.7rem;
  }
  .save-flight-btn {
    margin-top: 0.8rem;
    background: #4ade80;
    color: #10331e;
    padding: 0.55rem;
    border-radius: 10px;
  }
  .remaining-display {
    margin-top: 1rem;
    text-align: center;
  }
  .remaining-label {
    font-size: 0.75rem;
    color: #a0a3c0;
  }
  .remaining-time {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 0.3rem 0;
  }
  .progress-bar {
    background: #14162a;
    border-radius: 8px;
    height: 8px;
    width: 100%;
    overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, #38bdf8, #4ade80);
    height: 100%;
    width: 0%;
    transition: width 0.5s ease;
  }
  .progress-percent {
    font-size: 0.75rem;
    color: #a0a3c0;
    margin-top: 0.3rem;
  }
</style>
</head>
<body>

  <h1>Klo Counter</h1>

  <div class="count" id="count">0</div>

  <div class="buttons">
    <button class="minus" onclick="changeCount(-1)">−1</button>
    <button class="plus" onclick="changeCount(1)">+1</button>
  </div>

  <button class="reset" onclick="resetCount()">Zähler zurücksetzen</button>

  <div class="flight-section">
    <button class="toggle-flight" id="toggle-flight-btn" onclick="toggleFlightMode()">✈️ Flugmodus anzeigen</button>

    <div id="flight-panel" class="flight-panel hidden">
      <h2>Flugmodus</h2>

      <div class="manual-inputs">
        <label>Abflug (Datum & Uhrzeit)</label>
        <input type="datetime-local" id="departure-time" />

        <label>Ankunft (Datum & Uhrzeit)</label>
        <input type="datetime-local" id="arrival-time" />

        <button class="save-flight-btn" onclick="saveFlightTimes()">Zeiten speichern</button>
      </div>

      <div id="remaining-display" class="remaining-display hidden">
        <div class="remaining-label">Verbleibende Flugzeit</div>
        <div class="remaining-time" id="remaining-time">--:--:--</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-percent" id="progress-percent"></div>
      </div>
    </div>
  </div>

  <div class="footer">
      </div>

<script>
  const STORAGE_KEY = "klo-counter-value";
  const countEl = document.getElementById("count");

  function loadCount() {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? parseInt(stored, 10) : 0;
  }

  function saveCount(value) {
    localStorage.setItem(STORAGE_KEY, value);
  }

  let count = loadCount();
  countEl.textContent = count;

  function changeCount(delta) {
    count = Math.max(0, count + delta);
    countEl.textContent = count;
    saveCount(count);
  }

  function resetCount() {
    if (confirm("Zähler wirklich auf 0 zurücksetzen?")) {
      count = 0;
      countEl.textContent = count;
      saveCount(count);
    }
  }

  // ---------- Flugmodus ----------
  const FLIGHT_KEYS = {
    dep: "klo-counter-flight-dep",
    arr: "klo-counter-flight-arr"
  };
 
  const flightPanel = document.getElementById("flight-panel");
  const toggleBtn = document.getElementById("toggle-flight-btn");
  const depInput = document.getElementById("departure-time");
  const arrInput = document.getElementById("arrival-time");
  const remainingDisplay = document.getElementById("remaining-display");
  const remainingTimeEl = document.getElementById("remaining-time");
  const progressFill = document.getElementById("progress-fill");
  const progressPercent = document.getElementById("progress-percent");
 
  let flightTimer = null;
 
  // Gespeicherte Werte beim Laden wiederherstellen
  const savedDep = localStorage.getItem(FLIGHT_KEYS.dep);
  const savedArr = localStorage.getItem(FLIGHT_KEYS.arr);
  if (savedDep) depInput.value = savedDep;
  if (savedArr) arrInput.value = savedArr;
  if (savedDep && savedArr) startCountdown();
 
  function toggleFlightMode() {
    flightPanel.classList.toggle("hidden");
    toggleBtn.textContent = flightPanel.classList.contains("hidden")
      ? "✈️ Flugmodus anzeigen"
      : "✈️ Flugmodus ausblenden";
  }
 
  function saveFlightTimes() {
    if (!depInput.value || !arrInput.value) {
      alert("Bitte Abflug- und Ankunftszeit eintragen.");
      return;
    }
    localStorage.setItem(FLIGHT_KEYS.dep, depInput.value);
    localStorage.setItem(FLIGHT_KEYS.arr, arrInput.value);
    startCountdown();
  }
 
  function startCountdown() {
    remainingDisplay.classList.remove("hidden");
    if (flightTimer) clearInterval(flightTimer);
    updateCountdown();
    flightTimer = setInterval(updateCountdown, 1000);
  }
 
  function updateCountdown() {
    const dep = new Date(depInput.value).getTime();
    const arr = new Date(arrInput.value).getTime();
    const now = Date.now();
 
    if (isNaN(dep) || isNaN(arr) || arr <= dep) {
      remainingTimeEl.textContent = "Ungültige Zeiten";
      return;
    }
 
    const totalDuration = arr - dep;
    const remaining = arr - now;
 
    if (now < dep) {
      remainingTimeEl.textContent = "Flug noch nicht gestartet";
      progressFill.style.width = "0%";
      progressPercent.textContent = "";
      return;
    }
 
    if (remaining <= 0) {
      remainingTimeEl.textContent = "🎉 Gelandet";
      progressFill.style.width = "100%";
      progressPercent.textContent = "100%";
      clearInterval(flightTimer);
      return;
    }
 
    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    remainingTimeEl.textContent =
      `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
 
    const percentDone = Math.min(100, Math.max(0, ((now - dep) / totalDuration) * 100));
    progressFill.style.width = percentDone.toFixed(1) + "%";
    progressPercent.textContent = percentDone.toFixed(0) + "% des Flugs geschafft";
  }
 
  function toLocalDatetimeString(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }
</script>
 
</body>
</html>
